name: Generate Coffee Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: PranavMundhra
          outputs: |
            dist/snake-coffee.svg?color_snake=#6F4E37&color_dots=#F3E9DC,#E8C27A,#FFB000,#B07A10,#6F4E37
            dist/snake-coffee-dark.svg?palette=github-dark&color_snake=#FFB000&color_dots=#161B22,#4B3621,#8A5A00,#B07A10,#FFB000

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
