name: Generate Coffee Snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: PranavMundhra
          outputs: |
            dist/snake-coffee.svg?color_snake=#C08552&color_dots=#1C1410,#4B3621,#6F4E37,#A9714B,#C08552
            dist/snake-coffee-dark.svg?palette=github-dark&color_snake=#E8A87C&color_dots=#1C1410,#4B3621,#6F4E37,#A9714B,#F5E6D3

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
